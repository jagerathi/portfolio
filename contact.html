<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Kevin Knoll</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </header>

  <main>

    <section class="section">
      <a href="index.html" class="back-link">← Back</a>
      <h1 class="page-title">Get in touch</h1>
      <p class="bio" style="text-align:left; margin: 0 0 2rem;">
        I'm always open to interesting conversations, collaboration, or just a friendly hello.
      </p>

      <form class="contact-form" id="contactForm">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Jane Smith" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="What's on your mind?" required></textarea>
        </div>
        <button type="submit">Send message</button>
        <p class="form-status" id="formStatus" aria-live="polite"></p>
      </form>
    </section>

  </main>

  <footer>
    <p>© 2026 Kevin Knoll</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
